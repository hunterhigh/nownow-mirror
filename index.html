<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- ⚠️ 这里**故意没有**写死的 <link rel="icon">。
         写死一行再由 JS 改 href，浏览器就会先显示那一张、再换成你的 —— 这就是闪烁的根。
         改 href 只是把闪烁提前，消不掉它。所以图标节点完全由下面这段脚本创建：
         整个生命周期里 href 只被赋值一次，没有"从 A 换到 B"这回事。 -->
    <script>
      // 在任何渲染之前就把图标定下来：有上次记下的就用它，没有才用默认头像。
      (function () {
        var href = '/avatars/a3.png'
        try {
          var saved = localStorage.getItem('nownow_favicon')
          // data: 自带图片内容、零网络，是最稳的一种；
          // 其余只认同源（昨天换过域名，旧域名的绝对地址会是个裂图，
          // 宁可用默认也不要贴坏的）。
          if (saved && (saved.indexOf('data:image/') === 0 || saved.charAt(0) === '/' || saved.indexOf(location.origin) === 0)) {
            href = saved
          }
        } catch (e) { /* 隐私模式没有 localStorage：用默认，不影响任何功能 */ }
        var link = document.createElement('link')
        link.rel = 'icon'
        link.href = href
        document.head.appendChild(link)
      })()
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- maximum-scale=1：禁止 iOS 点输入框时整页自动放大（捏合缩放不受影响） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fffefb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NowNow" />
    <title>NowNow</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
