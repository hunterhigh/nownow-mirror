<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 指向头像本体而不是单独做一张 favicon：登录后 Board 会把这个节点的 href
         换成用户选的头像，用同一个文件就只下载一次、共用一份缓存。
         刷新时会先显示这张、再换成你的头像 —— 那一下闪烁按海涛的决定不处理了：
         消掉它要么让图标依赖 JS，要么把图片缓存进 localStorage，
         为一个刷新时的瞬间不值得。 -->
    <link rel="icon" type="image/png" href="/avatars/a3.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- maximum-scale=1：禁止 iOS 点输入框时整页自动放大（捏合缩放不受影响） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fffefb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NowNow" />
    <title>NowNow</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
